<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sudarshan Chaudhari portfolio preview</title>
  <desc id="desc">Red System-window social preview card: Senior Quality Engineer, test automation and AI systems builder, with 422 repositories, 173 public and 249 private.</desc>
  <defs>
    <radialGradient id="bg" cx="85%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#3a0d14" />
      <stop offset="60%" stop-color="#0d0306" />
      <stop offset="100%" stop-color="#050102" />
    </radialGradient>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ff2e4d" opacity="0.05" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#scan)" />

  <rect x="68" y="70" width="1064" height="490" rx="6" fill="#160509" stroke="#ff2e4d" stroke-width="2" filter="url(#glow)" />
  <rect x="68" y="70" width="1064" height="490" rx="6" fill="#0d0306" stroke="#ff2e4d" stroke-width="2" />

  <rect x="108" y="110" width="92" height="92" rx="6" fill="none" stroke="#ff2e4d" stroke-width="2" />
  <text x="154" y="170" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="40" font-weight="600" fill="#ff2e4d">SC</text>

  <text x="232" y="150" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#ff2e4d">[ SYSTEM ] A NEW PLAYER HAS AWAKENED</text>
  <text x="232" y="186" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="1" fill="#ff6b7d">QA · TEST AUTOMATION · AI SYSTEMS · ANDROID</text>

  <text x="108" y="282" font-family="'Bricolage Grotesque', 'Avenir Next', sans-serif" font-size="56" font-weight="800" fill="#fff1f2">Sudarshan Chaudhari</text>
  <text x="108" y="342" font-family="'Bricolage Grotesque', 'Avenir Next', sans-serif" font-size="32" font-weight="600" fill="#fff1f2">Senior Quality Engineer, test automation</text>
  <text x="108" y="384" font-family="'Bricolage Grotesque', 'Avenir Next', sans-serif" font-size="32" font-weight="600" fill="#fff1f2">specialist and AI systems builder.</text>

  <rect x="108" y="428" width="280" height="64" rx="6" fill="#ff2e4d" />
  <text x="248" y="470" text-anchor="middle" font-family="'Bricolage Grotesque', 'Avenir Next', sans-serif" font-size="28" font-weight="700" fill="#050102">422 repositories</text>

  <g>
    <rect x="820" y="130" width="260" height="330" rx="6" fill="#160509" stroke="#3a0d14" stroke-width="2" />
    <text x="848" y="176" font-family="'IBM Plex Mono', monospace" font-size="20" letter-spacing="3" fill="#ff2e4d">STATUS</text>
    <text x="848" y="254" font-family="'Bricolage Grotesque', 'Avenir Next', sans-serif" font-size="64" font-weight="800" fill="#fff1f2">173</text>
    <text x="848" y="290" font-family="'IBM Plex Mono', monospace" font-size="17" fill="#a8828a">public repositories</text>
    <line x1="848" y1="322" x2="1048" y2="322" stroke="#3a0d14" stroke-width="2" stroke-dasharray="6 6" />
    <text x="848" y="394" font-family="'Bricolage Grotesque', 'Avenir Next', sans-serif" font-size="64" font-weight="800" fill="#fff1f2">249</text>
    <text x="848" y="430" font-family="'IBM Plex Mono', monospace" font-size="17" fill="#a8828a">private repositories</text>
  </g>

  <text x="108" y="536" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="2" fill="#ff6b7d">13+ YEARS IN QA · VERIFIED NOV 14, 2026 · BANGKOK, THAILAND</text>
</svg>
